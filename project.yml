name: YunXiOS
options:
  bundleIdPrefix: com.yunx
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    # 未签名构建：CI 直接用 xcodebuild archive 产出未签名包，无需证书
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  YunXiOS:
    type: application
    platform: iOS
    sources:
      - path: YunXiOS
        excludes:
          - "Info.plist"
    info:
      path: YunXiOS/Info.plist
      properties:
        CFBundleDisplayName: 云析
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 深链接：自有协议 yunx://resolve?url=<编码链接>&pwd=<提取码>
        # 对应 Android 的 com.yunx.app.link.YunxLink 注册项。
        # ★ 网盘域名（pan.quark.cn 等）无法在 iOS 上做 Universal Link 接管：
        #   那要求域主在 /.well-known/apple-app-site-association 放校验文件，第三方网盘不会配合。
        #   因此 iOS 侧从外部拿链接的路径 = yunx:// + 「分享 → 云析」Share Extension。
        CFBundleURLTypes:
          - CFBundleURLName: com.yunx.app.ios.deeplink
            CFBundleURLSchemes:
              - yunx

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yunx.app.ios
        PRODUCT_NAME: YunXiOS
        INFOPLIST_FILE: YunXiOS/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # 单元测试：深链接与多账号槽位规则（纯逻辑，跑在模拟器上）
  YunXiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: YunXiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yunx.app.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"

schemes:
  # ★ 只写 XcodeGen 认识的键（此前用了 shareScheme，未知键会让 xcodegen 直接报错，
  #   从而把两个工作流一起带崩）。archive 用 Release，与 build-ipa.yml 的 -configuration 一致。
  YunXiOS:
    build:
      targets:
        YunXiOS: all
        # 测试 target 必须进 build 列表并标 [test]，否则 xcodebuild test 不会构建测试 bundle
        YunXiOSTests: [test]
    test:
      targets:
        - YunXiOSTests
    run:
      config: Debug
    archive:
      config: Release

