name: YunXiOS
options:
  bundleIdPrefix: com.yunx
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    # 未签名构建：CI 直接用 xcodebuild archive 产出未签名包，无需证书
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  YunXiOS:
    type: application
    platform: iOS
    sources:
      - path: YunXiOS
        excludes:
          - "Info.plist"
    info:
      path: YunXiOS/Info.plist
      properties:
        CFBundleDisplayName: 云析
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yunx.app.ios
        PRODUCT_NAME: YunXiOS
        INFOPLIST_FILE: YunXiOS/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
